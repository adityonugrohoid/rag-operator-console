services:
  # Base images for optimized builds
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: rag-operator-console-base:latest
    profiles:
      - build-only

  ml-base:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: rag-operator-console-ml-base:latest
    depends_on:
      - base
    profiles:
      - build-only

  chroma:
    image: chromadb/chroma:latest
    container_name: rag-chroma
    ports:
      - "2000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
      PERSIST_DIRECTORY: /chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    image: rag-operator-console-ingestion:latest
    container_name: rag-ingestion
    ports:
      - "2001:8001"
    environment:
      CHROMA_HOST: http://chroma:8000
    depends_on:
      - chroma
    restart: unless-stopped

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    image: rag-operator-console-retrieval:latest
    container_name: rag-retrieval
    ports:
      - "2002:8002"
    environment:
      CHROMA_HOST: http://chroma:8000
    depends_on:
      - chroma
    restart: unless-stopped

  query:
    build:
      context: .
      dockerfile: services/query/Dockerfile
    image: rag-operator-console-query:latest
    container_name: rag-query
    ports:
      - "2003:8003"
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHROMA_HOST: http://chroma:8000
      RETRIEVAL_URL: http://retrieval:8002
      LLM_MODEL: llama3.2:3b
    networks:
      - default
      - ollama-network
    depends_on:
      - retrieval
    restart: unless-stopped

  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    image: rag-operator-console-api_gateway:latest
    container_name: rag-api-gateway
    ports:
      - "2080:8080"
    environment:
      INGESTION_URL: http://ingestion:8001
      RETRIEVAL_URL: http://retrieval:8002
      QUERY_URL: http://query:8003
    depends_on:
      - ingestion
      - retrieval
      - query
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    image: rag-operator-console-console:latest
    container_name: rag-console
    ports:
      - "2501:8501"
    environment:
      API_URL: http://api_gateway:8080
    depends_on:
      - api_gateway
    restart: unless-stopped

networks:
  ollama-network:
    external: true
    name: ollama-runtime-network  # Phase 0: ollama-runtime (planned)

volumes:
  chroma_data:
